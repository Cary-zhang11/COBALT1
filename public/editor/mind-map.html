<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用例编辑器 — 脑图画布</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #mindMapContainer { width: 100%; height: 100%; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body>
  <div id="mindMapContainer"></div>
  <script>
  (function() {
    var origin = window.location.origin;
    function post(msg) { window.parent.postMessage(msg, origin); }
    post({ type: "loading", payload: { phase: "start" } });

    var heartbeat = setInterval(function() {
      post({ type: "loading", payload: { phase: "downloading" } });
    }, 8000);

    var scripts = [
      "/vendor/simple-mind-map.umd.min.js",
      "/vendor/jszip.min.js",
      "/editor/mind-map.js"
    ];
    var idx = 0;

    function loadNext() {
      if (idx >= scripts.length) {
        clearInterval(heartbeat);
        return;
      }
      var src = scripts[idx++];
      post({ type: "loading", payload: { phase: "downloading", file: src } });
      var s = document.createElement("script");
      s.src = src;
      s.onload = function() {
        if (idx < scripts.length) loadNext();
        else clearInterval(heartbeat);
      };
      s.onerror = function() {
        clearInterval(heartbeat);
        post({ type: "error", payload: { message: "脚本加载失败: " + src } });
      };
      document.body.appendChild(s);
    }
    loadNext();
  })();
  </script>
</body>
</html>
