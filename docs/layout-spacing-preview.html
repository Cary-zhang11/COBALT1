<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COBALT 布局方案 v1.2 预览</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            border: "hsl(214 31.8% 91.4%)",
            background: "hsl(0 0% 100%)",
            foreground: "hsl(222.2 84% 4.9%)",
            card: "hsl(0 0% 100%)",
            primary: { DEFAULT: "hsl(262.1 83.3% 57.8%)", foreground: "hsl(210 40% 98%)" },
            muted: { DEFAULT: "hsl(210 40% 96.1%)", foreground: "hsl(215.4 16.3% 46.9%)" },
            accent: { DEFAULT: "hsl(189 94% 43%)", foreground: "hsl(0 0% 100%)" },
          },
          borderRadius: { lg: "0.75rem" },
          maxWidth: { "screen-xl": "1280px" },
        },
      },
    };
  </script>
  <style>
    body { font-family: Inter, "PingFang SC", system-ui, sans-serif; }
    .width-guide { outline: 2px dashed rgba(139,92,246,.45); outline-offset: 3px; position: relative; }
    .width-guide::after {
      content: attr(data-label); position: absolute; top: -10px; left: 8px;
      font-size: 10px; font-weight: 600; color: #7c3aed; background: #f5f3ff;
      padding: 1px 6px; border-radius: 4px; border: 1px solid #ddd6fe; z-index: 10;
    }
    .struct-tag { display: inline-flex; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-right: 4px; margin-bottom: 4px; }
    .struct-tag.new { background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
    .struct-tag.old { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .struct-tag.proto { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .struct-tag.fix { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
    .sticky-footer {
      position: sticky; bottom: 0; z-index: 20;
      background: linear-gradient(to top, #fff 80%, transparent);
      padding-top: 12px; margin-top: 8px;
    }
    .callout { font-size: 11px; padding: 8px 12px; border-radius: 0 8px 8px 0; margin-bottom: 12px; border-left-width: 3px; }
    .callout-green { border-color: #10b981; background: #ecfdf5; color: #047857; }
    .callout-red { border-color: #f87171; background: #fef2f2; color: #b91c1c; }
    .callout-blue { border-color: #3b82f6; background: #eff6ff; color: #1d40af; }
    .callout-amber { border-color: #f59e0b; background: #fffbeb; color: #92400e; }
    .drag-zone { border: 2px dashed hsl(214 31.8% 91.4%); transition: all .2s; }
    .plan-table { width: 100%; font-size: 11px; border-collapse: collapse; }
    .plan-table th, .plan-table td { border: 1px solid hsl(214 31.8% 91.4%); padding: 6px 8px; text-align: left; vertical-align: top; }
    .plan-table th { background: hsl(210 40% 96.1%); font-weight: 600; }
    .plan-table code { font-size: 10px; background: #f3f4f6; padding: 1px 4px; border-radius: 3px; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .section-body { padding: 1.25rem; }
    .ant-stat-card { background: #fff; border-radius: 8px; padding: 20px 24px; border: 1px solid hsl(214 31.8% 91.4%); }
    .ant-stat-card .stat-value { font-size: 30px; line-height: 38px; font-weight: 600; color: rgba(0,0,0,.85); }
    .ant-stat-card .stat-footer { margin-top: 8px; font-size: 14px; color: rgba(0,0,0,.45); }
    .ant-chart-card { background: #fff; border-radius: 8px; border: 1px solid hsl(214 31.8% 91.4%); }
    .ant-chart-head { padding: 16px 24px 0; display: flex; justify-content: space-between; align-items: center; }
    .ant-chart-body { padding: 12px 24px 24px; height: 200px; }
    .chart-trend-wrap { height: 176px; position: relative; }
    .chart-trend-wrap svg { width: 100%; height: 100%; display: block; }
    .pie-mock { width: 140px; height: 140px; border-radius: 50%; margin: 0 auto; background: conic-gradient(#1890ff 0 35%, #52c41a 35% 58%, #faad14 58% 78%, #f5222d 78% 100%); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,.12); border-radius: 3px; }
  </style>
</head>
<body class="bg-background text-foreground antialiased h-screen flex flex-col">

  <header class="flex-shrink-0 border-b bg-card px-4 py-3 flex flex-wrap items-center justify-between gap-3">
    <div>
      <h1 class="text-sm font-bold">COBALT 布局方案 v1.2 预览</h1>
      <p class="text-xs text-muted-foreground mt-0.5">现状 / 建议（含对齐+右栏常驻）/ +原型增强 · 先看左侧「方案总览」</p>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <div class="flex rounded-lg border overflow-hidden text-xs font-medium" id="modeBtns">
        <button type="button" data-mode="old" class="px-3 py-2 border-r">现状</button>
        <button type="button" data-mode="new" class="px-3 py-2 border-r">建议 v1.2</button>
        <button type="button" data-mode="proto" class="px-3 py-2">+原型</button>
      </div>
      <label class="flex items-center gap-1 text-xs cursor-pointer">
        <input type="checkbox" id="toggleGuides" checked class="accent-violet-600" />
        宽度标注
      </label>
    </div>
  </header>

  <div class="flex flex-1 min-h-0">
    <aside class="w-64 border-r bg-card flex flex-col flex-shrink-0">
      <div class="p-6 border-b">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-500 to-cyan-500 flex items-center justify-center text-white text-xs font-bold">C</div>
          <div><div class="font-bold text-lg">COBALT</div><div class="text-[10px] text-muted-foreground">Sidebar 不变</div></div>
        </div>
      </div>
      <nav class="flex-1 p-4 space-y-1 text-sm overflow-y-auto" id="nav"></nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
      <div id="changeBanner" class="flex-shrink-0 px-6 py-2 text-xs border-b bg-muted/30"></div>
      <div class="flex-1 overflow-auto p-6">
        <div id="pageContainer" class="w-full mx-auto"></div>
      </div>
    </main>
  </div>

  <script>
    const NAV = [
      { id: "overview", label: "📋 方案总览", desc: "v1.2 完整清单" },
      { id: "wizard-s1", label: "生成向导 · Step1", desc: "输入物料" },
      { id: "wizard-s2", label: "生成向导 · Step2", desc: "关联用例" },
      { id: "wizard-s3", label: "生成向导 · Step3", desc: "生成结果" },
      { id: "history", label: "历史记录", desc: "" },
      { id: "editor", label: "用例编辑", desc: "树·详情·保存" },
      { id: "dashboard", label: "数据看板", desc: "含用户评价列" },
      { id: "logs", label: "日志列表", desc: "标杆" },
    ];

    const WF_NODES = ["文档解析", "需求分析", "用例生成", "质量校验", "导出格式"];

    let activeId = "overview";
    let mode = "new";
    let showGuides = true;

    const isProto = () => mode === "proto";
    const isNew = () => mode === "new" || mode === "proto";
    const isOld = () => mode === "old";

    function guide(cls, label) {
      if (!showGuides || !label) return cls;
      return `${cls} width-guide` + ` data-label="${label}"`;
    }

    function btnPrimary(t, outline) {
      return outline
        ? `<button class="border border-border text-foreground px-5 py-2.5 rounded-xl text-sm font-medium">${t}</button>`
        : `<button class="bg-primary text-primary-foreground px-5 py-2.5 rounded-xl text-sm font-medium shadow-sm">${t}</button>`;
    }

    function callout(text, type) {
      const m = { red: "callout-red", blue: "callout-blue", amber: "callout-amber", green: "callout-green" };
      return `<div class="callout ${m[type] || "callout-green"}">${text}</div>`;
    }

    function pageHeader(title, desc, actions = "") {
      if (isOld() && !actions) return "";
      const tag = isProto() ? '<span class="struct-tag proto">+原型</span>' : isNew() ? '<span class="struct-tag new">v1.2</span>' : "";
      return `<div class="mb-5 flex items-start justify-between gap-4 flex-wrap">
        <div>${tag}<h1 class="text-2xl font-bold">${title}</h1>${desc ? `<p class="text-sm text-muted-foreground mt-1">${desc}</p>` : ""}</div>
        ${actions ? `<div class="flex gap-2 flex-wrap">${actions}</div>` : ""}
      </div>`;
    }

    function stepBar(active) {
      const conn = isNew()
        ? '<div class="h-0.5 flex-1 mx-2 bg-border min-w-[12px]"></div>'
        : '<div class="h-0.5 w-8 mx-2 bg-border flex-shrink-0"></div>';
      const steps = ["输入物料", "关联用例", "生成并预览"];
      const fullWidthNote = isNew() ? '<span class="struct-tag fix">三步同宽 max-w-7xl · 右栏 sticky</span>' : '<span class="struct-tag old">Step条在左栏 · 全宽</span>';
      return `${fullWidthNote}
        <div class="flex items-center bg-card border rounded-xl p-4 mb-4 shadow-sm w-full">
          ${steps.map((s, i) => `
            <div class="flex items-center ${i < 2 ? "flex-1 min-w-0" : ""}">
              <div class="flex items-center gap-2 min-w-0">
                <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold flex-shrink-0 ${i <= active ? "bg-primary text-primary-foreground" : "bg-muted text-muted-foreground"}">${i < active ? "✓" : i + 1}</div>
                <span class="text-sm truncate ${i <= active ? "text-primary font-medium" : "text-muted-foreground"}">${s}</span>
              </div>
              ${i < 2 ? conn : ""}
            </div>`).join("")}
        </div>`;
    }

    function stickyFooter(left, right) {
      if (isOld()) return `<div class="flex ${left ? "justify-between" : "justify-end"} gap-3 mt-4">${left || ""}${right}</div>`;
      return `<div class="sticky-footer">
        <span class="struct-tag new">sticky 底栏 · 三步同结构</span>
        <div class="bg-card border rounded-xl shadow-sm px-5 py-3 flex items-center ${left ? "justify-between" : "justify-end"} gap-3">${left || ""}${right}</div>
      </div>`;
    }

    /** 右栏：单壳常驻 — Step1/2 轨迹+配置；Step3 轨迹+快捷操作 */
    function executionPanel(stepIndex, state) {
      const w = isOld() ? "w-56" : "w-60";
      const wLabel = isOld() ? "w-56" : "w-60 固定";

      if (isOld()) {
        if (stepIndex < 2) {
          return `<div class="${guide(w + " flex-shrink-0", wLabel)}">
            <div class="bg-card border rounded-xl p-4 sticky top-6 text-xs">
              <p class="font-semibold text-sm mb-2">当前配置预览</p>
              <div class="bg-muted rounded-lg p-3 space-y-2">
                <div class="flex justify-between gap-1"><span class="text-muted-foreground">物料</span><span class="truncate max-w-[100px]">未选择</span></div>
              </div>
              <p class="text-red-500 text-[10px] mt-2">无执行轨迹</p>
            </div></div>`;
        }
        return `<div class="${w} flex-shrink-0">
          <div class="bg-card border rounded-xl p-4 sticky top-6 text-xs space-y-2">
            <button class="w-full border rounded-lg py-2 text-xs">下载</button>
            <button class="w-full border rounded-lg py-2 text-xs">去编辑</button>
            <p class="text-red-500 text-[10px]">与主区 CTA 重复 · 整栏替换</p>
          </div></div>`;
      }

      const nodeState = (i) => {
        if (state === "wait") return "wait";
        if (state === "running") return i === 2 ? "running" : i < 2 ? "done" : "wait";
        return "done";
      };

      const nodes = WF_NODES.map((n, i) => {
        const st = nodeState(i);
        const dot = st === "done" ? "text-emerald-600" : st === "running" ? "text-primary font-medium" : "text-muted-foreground opacity-40";
        const icon = st === "done" ? "✓" : st === "running" ? "●" : "○";
        return `<div class="flex items-center gap-2 ${dot}"><span class="w-3 text-center text-[10px]">${icon}</span><span class="text-xs">${n}</span></div>`;
      }).join("");

      const configBlock = stepIndex < 2 ? `
        <div class="mt-4 pt-3 border-t border-border">
          <p class="text-xs font-semibold mb-2 px-1">当前配置预览</p>
          <div class="bg-muted/60 rounded-lg px-3 py-2.5 space-y-1.5 text-[11px]">
            ${[["物料来源", "需求_v2.docx"], ["参考知识", stepIndex === 1 ? "2 份" : "0 份"], ["历史范文", stepIndex === 1 ? "1 份" : "0 份"], ["输出格式", "Markdown"]].map(([k,v]) =>
              `<div class="grid grid-cols-[4.5rem_1fr] gap-2 items-center min-h-[18px]">
                <span class="text-muted-foreground">${k}</span>
                <span class="font-medium truncate text-right tabular-nums">${v}</span>
              </div>`).join("")}
          </div>
        </div>` : "";

      const quickBlock = stepIndex === 2 && state === "done" ? `
        <div class="mt-4 pt-3 border-t border-border">
          <p class="text-xs font-semibold mb-2">快捷操作</p>
          <div class="space-y-1.5">
            ${["下载 Markdown", "AI 微调", "编辑"].map(t =>
              `<button class="w-full flex items-center gap-2 text-xs px-3 py-2 rounded-lg border border-border hover:bg-muted/40 text-left">${t}</button>`
            ).join("")}
          </div>
          <p class="text-[10px] text-muted-foreground mt-2 pt-2 border-t">Token: 4,238</p>
        </div>` : "";

      const doneBanner = stepIndex === 2 && state === "done" ? `
        <div class="mt-3 bg-emerald-50 border border-emerald-100 rounded-lg p-2 text-[10px] text-emerald-700">✓ 执行完成 · 文件已就绪</div>` : "";

      return `<div class="${guide(w + " flex-shrink-0 self-start", wLabel + " · sticky")}">
        <div class="bg-card border rounded-xl p-4 sticky top-6 text-xs max-h-[calc(100vh-8rem)] overflow-y-auto shadow-sm">
          <span class="struct-tag new">sticky top-6 · 滚动时始终可见</span>
          <div class="flex items-center justify-between mb-3 mt-1">
            <h4 class="font-semibold text-sm">执行轨迹</h4>
            ${state === "running" ? '<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>' : ""}
          </div>
          <div class="space-y-1">${nodes}</div>
          ${configBlock}${doneBanner}${quickBlock}
        </div>
      </div>`;
    }

    /** 三步统一宽度，切换步骤时左缘/右栏位置不变 */
    const WIZARD_SHELL_UNIFIED = { cls: "max-w-7xl", label: "三步统一 · 1280px" };

    function wizardShellWidth() {
      if (isOld()) return { cls: "w-full", label: "全宽（切换会跳）" };
      return WIZARD_SHELL_UNIFIED;
    }

    /** 统一向导骨架：Step条 + 主区 + 右栏，整体限宽居中 */
    function wizardShell(stepIndex, mainInner, footerLeft, footerRight, panelState, opts = {}) {
      const { calloutText, calloutType, headerActions } = opts;
      const oldLayout = isOld();
      const shell = wizardShellWidth();

      if (oldLayout) {
        return `${pageHeader("用例生成", `Step ${stepIndex + 1}`)}
          ${calloutText ? callout(calloutText, calloutType || "red") : ""}
          <div class="flex gap-6">
            <div class="flex-1 min-w-0 space-y-4">
              ${stepBar(stepIndex)}${mainInner}${stickyFooter(footerLeft, footerRight)}
            </div>
            ${executionPanel(stepIndex, panelState)}
          </div>`;
      }

      return `${pageHeader("用例生成", `Step ${stepIndex + 1}`, headerActions || "")}
        ${calloutText ? callout(calloutText, calloutType || "green") : ""}
        <div class="${guide(shell.cls + " mx-auto w-full", shell.label)}">
          ${stepBar(stepIndex)}
          <div class="flex gap-5 items-start min-h-[min(480px,calc(100vh-11rem))]">
            <div class="flex-1 min-w-0 space-y-4">${mainInner}${stickyFooter(footerLeft, footerRight)}</div>
            ${executionPanel(stepIndex, panelState)}
          </div>
        </div>`;
    }

    /* ─── 方案总览 ─── */
    function viewOverview() {
      return `<div class="max-w-4xl space-y-5">
        <h1 class="text-2xl font-bold">COBALT 布局优化 · 完整方案 v1.2</h1>
        <p class="text-sm text-muted-foreground">在保持配色与 Sidebar 前提下，统一宽度/间距/向导骨架。左侧导航可逐页预览；顶部切换「现状 / 建议 / +原型」。</p>

        ${callout("<strong>v1.2 新增</strong>：向导按步限宽居中 · 右栏常驻 · 三步左缘对齐 · 单层滚动", "amber")}

        <h2 class="text-sm font-bold">阶段 A · 全站 padding（5 文件）</h2>
        <table class="plan-table">
          <tr><th>文件</th><th>改动</th></tr>
          <tr><td><code>usecase-gen/page.tsx</code></td><td>唯一 <code>p-6</code>；向导 Tab 内由组件按步 <code>max-w-* mx-auto</code>；历史 <code>max-w-4xl</code>；编辑/看板 <code>max-w-7xl</code></td></tr>
          <tr><td><code>dashboard.tsx</code></td><td>去掉根 <code>p-6 overflow-auto</code></td></tr>
          <tr><td><code>knowledge-base.tsx</code></td><td>同上；左筛 <code>w-52</code> 可选</td></tr>
          <tr><td><code>history-list.tsx</code></td><td>去 <code>p-4</code>；<code>max-w-4xl mx-auto</code></td></tr>
          <tr><td><code>app/page.tsx</code></td><td>日志 <code>p-8→p-6</code>，保持 <code>max-w-4xl</code></td></tr>
        </table>

        <h2 class="text-sm font-bold">阶段 B · 生成向导 + 右栏（核心）</h2>
        <table class="plan-table">
          <tr><th>文件</th><th>改动</th></tr>
          <tr><td><code>generate-wizard.tsx</code></td><td>
            ① Step 条提到两栏之上（全宽）<br/>
            ② 去掉外层+左列 <code>overflow-auto</code>（仅 page 滚动）<br/>
            ③ 切换步骤 <code>scrollTo(0)</code><br/>
            ④ 三步<strong>统一</strong> <code>max-w-7xl mx-auto</code>（≈1280px）<br/>
            ④b 右栏 <code>sticky top-6 self-start</code>，随滚动始终可见<br/>
            ⑤ Step1 单卡片+「或」· Step2 <code>lg:grid-cols-2</code>（双栏保留搜索+业务类型，无已选汇总条）· Step3 KPI <code>xl:grid-cols-4</code><br/>
            ⑥ sticky 底栏三步统一
          </td></tr>
          <tr><td><code>generate-wizard.tsx</code> Step3</td><td>
            统一 section 壳 · KPI <code>tabular-nums</code>（AI 质量评分）· 微调默认展开<br/>
            输出文件：每行 <code>预览|编辑|下载</code> · 无独立底栏 CTA<br/>
            <strong>评价</strong>：输出文件与 AI 微调之间 · 用户 1–5 星（<code>RatingPanel</code> / <code>POST …/feedback</code>）· 右栏不放评价
          </td></tr>
          <tr><td><code>execution-panel.tsx</code></td><td>
            ① 单壳结构，禁止互斥 <code>return</code><br/>
            ② <strong>Step1/2</strong>：执行轨迹（wait）+ 当前配置预览<br/>
            ③ <strong>Step3 生成中</strong>：执行轨迹 running/done<br/>
            ④ <strong>Step3 完成</strong>：轨迹全 done + 快捷操作<br/>
            ⑤ <code>w-60</code>，文案 <code>max-w-[160px]</code>，<code>sticky top-6</code>
          </td></tr>
        </table>

        <h2 class="text-sm font-bold">阶段 C · 其他 Tab</h2>
        <table class="plan-table">
          <tr><th>页面</th><th>改动</th></tr>
          <tr><td>历史记录</td><td>Page Header + 列表行（<strong>无状态图标</strong>，仅右侧文字标签）</td></tr>
          <tr><td>日志列表</td><td>与历史同结构 · 去掉左侧 Icon 色块</td></tr>
          <tr><td>用例编辑</td><td><code>max-w-7xl</code> · Page Header（模块/用例/P0–P2）· 左树 <code>w-72</code> · 右详情表单 · 底栏保存/放弃 · +原型 Tab</td></tr>
          <tr><td>数据看板</td><td><code>#dashboard-user-rating-table</code>：<strong>用户评价</strong>列 = 星级 + 补充说明（<code>comment</code> 截断）· 不落 KPI/分布图</td></tr>
        </table>

        <h2 class="text-sm font-bold">明确不改</h2>
        <p class="text-xs text-muted-foreground">login/register · tasks 相关页 · Sidebar · 弹窗组件 · 业务逻辑/API</p>

        <h2 class="text-sm font-bold">默认决策（D1–D7）</h2>
        <ul class="text-xs space-y-1 list-disc pl-4 text-muted-foreground">
          <li>D1 内容居中 <code>mx-auto</code></li>
          <li>D2 右栏保留，<code>w-64</code>，三步常驻</li>
          <li>D3 阶段 A+B+C 全做</li>
          <li>D4 日志/历史 <code>max-w-4xl</code></li>
          <li>D5 知识库左栏 <code>w-52</code></li>

      const { meta = "", collapsed = false, collapsedHint = "点击标题展开", chevron = true } = opts;

      /** 现网 dashboard.tsx：双 Y 轴折线 · count #3b82f6 · avgScore #10b981 · h-176 */

            </div>
          </div>
          <div class="chart-trend-wrap focus:outline-none">
            <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
              ${gridY}
              <polyline points="${countPts}" fill="none" stroke="#3b82f6" stroke-width="2" vector-effect="non-scaling-stroke"/>
              <polyline points="${scorePts}" fill="none" stroke="#10b981" stroke-width="2" vector-effect="non-scaling-stroke"/>
              ${count.map((v,i)=>`<circle cx="${px(i)}" cy="${pyC(v)}" r="2.5" fill="#3b82f6"/>`).join("")}
              ${score.map((v,i)=>`<circle cx="${px(i)}" cy="${pyS(v)}" r="2.5" fill="#10b981"/>`).join("")}
              ${xLabels}

            </svg>
          </div>
          <p class="text-[10px] text-muted-foreground mt-2">现网：<code>LineChart</code> + 双 <code>YAxis</code> · <code>height={176}</code> · 不改 recharts 配置</p>
        </div>`;
      };

      const pieMock = `<div class="flex items-center justify-center h-full min-h-[176px]"><div class="pie-mock"></div></div>`;
      const hbarMock = `<div class="space-y-2 h-full flex flex-col justify-center">${["张三","李四","王五","赵六","钱七"].map((n,i)=>`<div class="flex items-center gap-2 text-xs"><span class="w-10 text-muted-foreground">${n}</span><div class="flex-1 h-5 bg-muted/50 rounded overflow-hidden"><div class="h-full bg-[#1890ff] rounded" style="width:${[92,78,65,54,48][i]}%"></div></div><span class="tabular-nums text-muted-foreground w-6">${[92,78,65,54,48][i]}</span></div>`).join("")}</div>`;
      const ratingDistMock = `<div class="min-h-[176px] flex flex-col justify-center gap-2">
          ${[[5,52],[4,28],[3,12],[2,5],[1,3]].map(([star,pct])=>`<div class="flex items-center gap-2 text-xs">
            <span class="w-9 text-muted-foreground tabular-nums">${star} 星</span>
            <div class="flex-1 h-4 bg-muted/50 rounded overflow-hidden"><div class="h-full bg-amber-400/90 rounded" style="width:${pct}%"></div></div>
            <span class="w-10 text-right tabular-nums text-muted-foreground">${pct}%</span>
          </div>`).join("")}
          <p class="text-[10px] text-muted-foreground mt-2 pt-2 border-t border-border/50"><span class="struct-tag new">TaskFeedback</span> 评价率 67%（有评任务 / 已完成）</p>
        </div>`;
      return `<div class="${guide("max-w-7xl mx-auto w-full", "max-w-7xl")}">
        ${isProto() ? '<span class="struct-tag proto">Ant Pro</span>' : '<span class="struct-tag new">Ant Pro Analysis</span>'}
        <div class="mb-6">
          <h1 class="text-xl font-semibold text-[rgba(0,0,0,.85)]">数据看板</h1>
          <p class="text-sm text-muted-foreground mt-1">用例生成统计 · 参考 <span class="text-primary">pro.ant.design/dashboard/analysis</span></p>
        </div>
        ${isNew() ? callout("v1.2 看板：<strong>用户评价</strong> 三处 — KPI「用户平均评分」· 图表「评价分布」· 表格列；KPI「AI 平均质量分」与向导质量分同源；趋势图保持现网", "green") : ""}

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4 mb-6">
          ${antStat("累计用例数", "2,401", 12.5, true, "📊", "bg-primary/10")}
          ${antStat("月活跃用户", "38", 5.2, false, "👥", "bg-emerald-100")}
          ${antStat("AI 平均质量分", "86", 3.1, true, "🎯", "bg-amber-100")}
          ${antStat("平均耗时", "3.8分", 8.0, false, "⏱", "bg-violet-100")}
          ${antStat("用户平均评分", "4.2", 6.8, true, "⭐", "bg-amber-50")}
        </div>
        <p class="text-[10px] text-muted-foreground -mt-4 mb-6 px-1">第五格为 <code>TaskFeedback.rating</code> 均值（1–5）；与 KPI「AI 平均质量分」勿混用</p>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-4">
          ${chartTrendExisting()}
          ${chartCard("需求类型分布", "现网 PieChart · h-176", pieMock)}
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4 mb-4">
          ${chartCard("覆盖维度分布", "测试维度", pieMock)}
          ${chartCard("用户评价分布", "近 30 天 · 1–5 星占比", ratingDistMock)}
          ${chartCard("人员使用 Top 10", "近 30 天", hbarMock, "md:col-span-2 xl:col-span-2")}
        </div>

        ${dashboardRecentRecordsTable("new")}
      </div>`;
    }

    function viewLogs() {
      const showOldIcon = isOld();
      const rows = showOldIcon
        ? `<div class="flex items-center gap-4 p-4 bg-card border rounded-xl">
            <div class="p-2 rounded-lg bg-emerald-100 text-emerald-600"><span class="struct-tag old">Icon</span>✓</div>
            <div class="flex-1"><p class="font-medium text-sm">用例生成</p><p class="text-xs text-muted-foreground truncate">Generate test cases…</p></div>
            <span class="text-xs px-2 py-0.5 rounded bg-emerald-100 text-emerald-700">已完成</span>
          </div>`
        : `<div class="space-y-3">
            ${listRow("用例生成", "Generate test cases for payment module…", "已完成", "bg-emerald-100 text-emerald-700", false)}
            ${listRow("用例生成", "User registration flow requirements…", "执行中", "bg-blue-100 text-blue-700", false)}
            ${listRow("用例生成", "Order refund policy document…", "失败", "bg-red-100 text-red-600", false)}
          </div>`;
      return `<div class="${guide("max-w-4xl mx-auto w-full", "max-w-4xl")}">
        ${pageHeader("日志列表", "查看所有执行日志")}
        ${isOld() ? callout("现状：左侧状态 Icon 色块", "red") : callout("v1.2：去掉 Icon · 仅右侧状态文字标签（与历史记录一致）", "green")}
        ${rows}
      </div>`;
    }

    const NOTES = {
      old: { overview: "当前问题汇总见总览表「现状」列", "wizard-s1": "Step条在左栏 · 右栏仅配置 · 双卡片", "wizard-s2": "无右栏 · 双列无断点", "wizard-s3": "右栏变快捷按钮 · 主CTA在底部", history: "小标题", editor: "disabled 工具栏", dashboard: "无页头", logs: "p-8" },
      new: { overview: "v1.2 · 三步同宽+右栏sticky · 看板Ant Pro", "wizard-s1": "max-w-7xl · 右栏 sticky", "wizard-s2": "双栏搜索筛选 · 无已选汇总", "wizard-s3": "评价在输出文件后 · 微调展开", history: "无状态图标 · 右标签", editor: "树+详情+保存条", dashboard: "用户评分 KPI+分布+表格列", logs: "无状态图标 · 同历史" },
      proto: { overview: "+原型增强", "wizard-s1": "大拖拽", "wizard-s2": "同骨架", "wizard-s3": "五段式", history: "—", editor: "Tab", dashboard: "Ant Pro + 环比", logs: "—" },
    };

    const VIEWS = { overview: viewOverview, "wizard-s1": viewWizardS1, "wizard-s2": viewWizardS2, "wizard-s3": viewWizardS3, history: viewHistory, editor: viewEditor, dashboard: viewDashboard, logs: viewLogs };

    function renderNav() {
      document.getElementById("nav").innerHTML = NAV.map(n => `
        <button type="button" data-id="${n.id}" class="w-full text-left px-3 py-2.5 rounded-lg ${activeId === n.id ? "bg-blue-50 text-blue-700" : "text-muted-foreground hover:bg-muted"}">
          <div class="font-medium text-sm">${n.label}</div>${n.desc ? `<div class="text-[10px] opacity-70">${n.desc}</div>` : ""}
        </button>`).join("");
      document.getElementById("nav").querySelectorAll("button").forEach(b => { b.onclick = () => { activeId = b.dataset.id; render(); }; });
    }

    function setMode(m) {
      mode = m;
      ["old","new","proto"].forEach(id => {
        const btn = document.querySelector(`[data-mode="${id}"]`);
        const active = mode === id;
        const styles = { old: active ? "bg-red-50 text-red-700 font-medium" : "bg-muted text-muted-foreground", new: active ? "bg-emerald-50 text-emerald-700 font-medium" : "bg-muted text-muted-foreground", proto: active ? "bg-blue-50 text-blue-700 font-medium" : "bg-muted text-muted-foreground" };
        btn.className = `px-3 py-2 ${id !== "proto" ? "border-r" : ""} ${styles[id]}`;
      });
      render();
    }

    function render() {
      const labels = { old: "【现状】", new: "【建议 v1.2】", proto: "【建议 + 原型】" };
      document.getElementById("changeBanner").innerHTML = `<strong>${labels[mode]}</strong> ${NOTES[mode][activeId] || ""}`;
      document.getElementById("pageContainer").innerHTML = VIEWS[activeId]();
      renderNav();
    }

    document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => setMode(b.dataset.mode));
    document.getElementById("toggleGuides").onchange = e => { showGuides = e.target.checked; render(); };

    setMode("new");
  </script>
</body>
</html>
